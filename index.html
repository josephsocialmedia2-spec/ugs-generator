<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Immobiliare · Feed prove</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--g:#45b900;--g2:#247700;--k:#101413;--bg:#fafafa;--muted:#737373;--line:#dbdbdb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#111}.page{max-width:975px;margin:auto;padding:28px 18px 60px}.profile{display:grid;grid-template-columns:180px 1fr;gap:48px;align-items:center;padding:18px 30px 36px}.avatar{width:150px;height:150px;border-radius:50%;background:var(--k);display:grid;place-items:center;border:1px solid #ccc;box-shadow:inset 0 0 0 9px #fff}.avatar span{font-weight:1000;font-style:italic;font-size:62px;color:#fff;letter-spacing:-8px}.avatar b{color:var(--g)}.head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.user{font-size:22px}.follow{border:0;background:#efefef;border-radius:8px;padding:8px 16px;font-weight:800}.stats{display:flex;gap:38px;margin:22px 0 18px}.stats b{font-weight:800}.bio{line-height:1.4}.bio b{display:block}.bio a{color:#00376b;text-decoration:none;font-weight:700}.tabs{border-top:1px solid var(--line);display:flex;justify-content:center;gap:56px;height:53px}.tab{height:53px;display:flex;align-items:center;border-top:1px solid #111;margin-top:-1px;font-size:12px;font-weight:800;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.tile{aspect-ratio:1/1;overflow:hidden;cursor:pointer;position:relative;background:#eee}.tile .post{position:absolute;inset:0;width:100%;height:125%;transform:translateY(-10%)}.tile:hover:after{content:'↗';position:absolute;inset:0;background:#0006;color:#fff;font-size:34px;display:grid;place-items:center}.post{position:relative;overflow:hidden;background:white;color:#111}.visual{position:absolute;inset:0;background:linear-gradient(140deg,#f8f8f4 0 48%,#d8dfd7 48% 100%)}.visual:before{content:'';position:absolute;right:-5%;top:6%;width:64%;height:55%;background:linear-gradient(90deg,#d6e8ef 0 48%,#8fa6ad 49% 52%,#e8f5f8 53%);box-shadow:0 0 0 16px #b6a38d,0 120px 0 40px #ded6ce;border-radius:4px}.visual:after{content:'';position:absolute;right:4%;bottom:19%;width:58%;height:23%;background:linear-gradient(180deg,#ded8d0,#b8afa7);border-radius:22px 22px 3px 3px;box-shadow:-12px 28px 0 -5px #76583c}.recruit .visual{background:linear-gradient(130deg,#f8faf8 0 46%,#dce5df 46% 100%)}.recruit .visual:before{width:44%;height:44%;right:6%;top:18%;border-radius:50% 50% 42% 42%;background:radial-gradient(circle at 50% 30%,#f0c2a7 0 19%,transparent 20%),linear-gradient(#322c29 0 44%,#171b1c 45%);box-shadow:0 140px 0 35px #202426}.recruit .visual:after{right:0;bottom:5%;width:58%;height:43%;background:linear-gradient(135deg,#1d2220 0 58%,#44b900 59%);border-radius:0;box-shadow:none;opacity:.9}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#fff 0 42%,#ffffffdc 46%,transparent 67%),linear-gradient(0deg,#111 0 18%,transparent 38%)}.brand{position:absolute;left:6.4%;top:5.3%;font-weight:1000;font-size:2.5cqw;z-index:4}.brand b{color:var(--g)}.brand small{display:block;font-size:.8cqw;letter-spacing:.16em;margin-top:.3cqw}.copy{position:absolute;left:6.4%;top:25%;width:55%;z-index:4}.kicker{font-size:1cqw;text-transform:uppercase;font-weight:900;margin-bottom:1.2cqw}.title{font-size:5cqw;line-height:.88;font-weight:1000;text-transform:uppercase;letter-spacing:-.12cqw}.title em{font-style:normal;color:var(--g);display:block}.sub{margin-top:1.4cqw;font-size:1.7cqw;line-height:1.05;font-weight:900;text-transform:uppercase}.desc{margin-top:1.3cqw;font-size:1.05cqw;line-height:1.35;width:85%}.chips{position:absolute;right:5%;bottom:22%;width:31%;z-index:5;display:grid;gap:.65cqw}.chip{background:#111d;color:#fff;border-radius:.75cqw;padding:.7cqw .8cqw;font-size:.88cqw;font-weight:800;display:flex;gap:.6cqw;align-items:center}.dot{width:2.1cqw;height:2.1cqw;border-radius:50%;background:var(--g);display:grid;place-items:center;flex:0 0 2.1cqw}.cta{position:absolute;left:5%;right:5%;bottom:5.4%;background:#101413;color:#fff;border-radius:.8cqw;padding:1.1cqw 1.2cqw;z-index:6;font-size:1.05cqw;font-weight:900}.cta strong{color:#80dc43;font-size:1.65cqw;margin-left:.7cqw}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:100;align-items:center;justify-content:center;padding:22px}.modal.open{display:flex}.modalcard{width:min(560px,92vw);aspect-ratio:4/5;background:#fff;position:relative}.modalcard .post{width:100%;height:100%}.close{position:fixed;right:24px;top:18px;border:0;background:none;color:#fff;font-size:36px;cursor:pointer}.status{text-align:center;color:var(--muted);font-size:12px;padding:12px}.tools{display:flex;justify-content:center;gap:10px;margin:18px 0 8px;flex-wrap:wrap}.tools a{padding:9px 13px;border-radius:8px;text-decoration:none;font-weight:800;font-size:13px}.primary{background:var(--g);color:#fff}.secondary{background:#efefef;color:#111}@media(max-width:700px){.profile{grid-template-columns:88px 1fr;gap:18px;padding:10px 4px 28px}.avatar{width:86px;height:86px;box-shadow:inset 0 0 0 5px #fff}.avatar span{font-size:38px}.stats{gap:14px;font-size:13px}.grid{gap:2px}.brand{font-size:3.2cqw}.brand small{font-size:1cqw}.copy{top:24%;width:60%}.title{font-size:5.4cqw}.sub{font-size:1.85cqw}.desc{font-size:1.2cqw}.chip{font-size:1.02cqw}.cta{font-size:1.15cqw}.cta strong{font-size:1.7cqw}}
</style>
</head>
<body>
<div class="page">
<section class="profile"><div class="avatar"><span>F<b>1</b></span></div><div><div class="head"><span class="user">f1immobiliare</span><button class="follow">Modifica profilo</button></div><div class="stats"><span><b>5</b> post</span><span><b>F1</b> Casa e Imprese</span><span><b>40</b> comuni</span></div><div class="bio"><b>F1 Immobiliare · Casa e Imprese</b>Case · Persone · Territorio · Futuro<br>Via Roma 6, Sant’Antonino di Susa (TO)<br><a href="https://www.f1immobiliare.com">f1immobiliare.com</a></div></div></section>
<div class="tools"><a class="primary" href="studio.html">Apri Content Studio</a><a class="secondary" href="#" onclick="downloadExcel();return false;">Scarica Excel sorgente</a></div>
<div class="tabs"><div class="tab">▦ POST</div></div>
<div id="feed" class="grid"></div><div id="status" class="status">Caricamento prime 5 righe dall’Excel…</div>
</div>
<div id="modal" class="modal"><button class="close" onclick="closeModal()">×</button><div id="modalcard" class="modalcard"></div></div>
<script>
const PARTS=['data/xlsx_parts/part0.b64','data/xlsx_parts/part1.b64','data/xlsx_parts/part2.b64','data/xlsx_parts/part3.b64'];
async function workbookBytes(){let b64='';for(const p of PARTS){const r=await fetch(p+'?v='+Date.now());if(!r.ok)throw new Error('parte Excel mancante');b64+=(await r.text()).trim()}const raw=atob(b64),u=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)u[i]=raw.charCodeAt(i);return u}
function inferComune(q){const m=q.match(/(?:a|ad|in)\s+([A-Za-zÀ-ÿ’' -]+)$/i);return m?m[1].trim():'Susa'}
function normalizeRows(ws){return XLSX.utils.sheet_to_json(ws,{defval:''}).map(x=>{const q=x.Query||x.Argomento||'';const low=q.toLowerCase();return{Query:q,Comune:x.Comune||inferComune(q),Categoria:x.Categoria||(/lavoro|agente immobiliare|collaboratore immobiliare|ricerca personale/.test(low)?'Ricerca personale':(/appartament|bilocal|trilocal|quadrilocal|cinque locali/.test(low)?'Appartamenti':'Generica'))}}).filter(x=>x.Query)}
async function downloadExcel(){const u=await workbookBytes();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download='query_f1_argomenti.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const fallback=[
{Comune:'Susa',Categoria:'Generica',Query:'immobili in vendita a Susa'},
{Comune:'Susa',Categoria:'Generica',Query:'case in vendita a Susa'},
{Comune:'Susa',Categoria:'Ricerca personale',Query:'lavoro agenzia immobiliare Susa prima esperienza'},
{Comune:'Susa',Categoria:'Appartamenti',Query:'appartamenti in vendita a Susa'},
{Comune:'Susa',Categoria:'Appartamenti',Query:'appartamenti signorili a Susa'}];
function spec(r){const q=(r.Query||'').toLowerCase(),c=(r.Comune||'Susa'),cat=(r.Categoria||'');if(cat.toLowerCase().includes('personale'))return{recruit:true,k:'Lavora con noi',a:'LAVORA',b:'CON NOI',sub:'PRIMA ESPERIENZA A '+c.toUpperCase(),d:'Formazione, affiancamento e crescita professionale nel territorio.',chips:['Anche prima esperienza','Formazione continua','Crescita professionale'],cta:'INVIA IL TUO CURRICULUM'};let a='CERCHIAMO',b='IMMOBILI',sub='IN VENDITA A '+c.toUpperCase(),d='Abbiamo clienti interessati al mercato locale. Se stai pensando di vendere, parlane con F1 Immobiliare.',chips=['Clienti selezionati',c+' e dintorni','Valutazione e promozione'];if(q.includes('case in vendita'))b='CASE';if(q.includes('appartamenti signorili')){a='APPARTAMENTI';b='SIGNORILI';sub='A '+c.toUpperCase();d='Per clientela referenziata ricerchiamo appartamenti signorili, ben tenuti o ristrutturati.';chips=['Segmento premium','Clientela referenziata',c+' e zona']}else if(q.includes('appartamenti in vendita')){a='APPARTAMENTI';b='IN VENDITA';sub='A '+c.toUpperCase();d='Cerchiamo e promuoviamo appartamenti per clienti interessati a '+c+'.';chips=['Appartamenti','Clienti selezionati','Promozione locale']}return{recruit:false,k:'Ricerca immobile',a,b,sub,d,chips,cta:'HAI UN IMMOBILE DA PROPORCI?'}}
function postHTML(r){const s=spec(r);return `<div class="post ${s.recruit?'recruit':''}"><div class="visual"></div><div class="shade"></div><div class="brand">F1 <b>IMMOBILIARE</b><small>CASA E IMPRESE</small></div><div class="copy"><div class="kicker">${s.k}</div><div class="title">${s.a}<em>${s.b}</em></div><div class="sub">${s.sub}</div><div class="desc">${s.d}</div></div><div class="chips">${s.chips.map((x,i)=>`<div class="chip"><span class="dot">${i==0?'✓':i==1?'⌂':'●'}</span>${x}</div>`).join('')}</div><div class="cta">${s.cta}<strong>371 370 8294</strong></div></div>`}
function render(rows){const feed=document.getElementById('feed');feed.innerHTML='';rows.slice(0,5).forEach((r,i)=>{const t=document.createElement('div');t.className='tile';t.innerHTML=postHTML(r);t.onclick=()=>openModal(r);feed.appendChild(t)});document.getElementById('status').textContent='5 grafiche generate dal file Excel · clicca una grafica per vederla 4:5.'}
function openModal(r){document.getElementById('modalcard').innerHTML=postHTML(r);document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
(async()=>{try{const u=await workbookBytes();const wb=XLSX.read(u,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=normalizeRows(ws);render(rows);document.getElementById('status').textContent='5 grafiche generate dal file Excel completo (2.880 argomenti) · clicca una grafica per vederla 4:5.'}catch(e){console.error(e);render(fallback);document.getElementById('status').textContent='Anteprima caricata con le prime 5 righe incorporate.'}})();
</script>
</body></html>
