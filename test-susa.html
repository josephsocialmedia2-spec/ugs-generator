<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Content Studio — Test Susa</title>
<style>
:root{--g:#43b900;--k:#111;--bg:#eef2ee;--line:#dbe3db}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#111}.wrap{max-width:1180px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font-size:26px;font-weight:1000}.brand b{color:var(--g)}.badge{padding:8px 12px;border-radius:999px;background:#e8f8df;color:#247500;font-weight:800;font-size:12px}.grid{display:grid;grid-template-columns:390px 1fr;gap:20px;margin-top:22px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 10px 30px #24452410}label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;margin:12px 0 6px}textarea{width:100%;min-height:100px;border:1px solid #d4ddd4;border-radius:10px;padding:12px;font:inherit}.btn{width:100%;border:0;border-radius:10px;padding:13px;background:linear-gradient(135deg,var(--g),#247b00);color:white;font-weight:900;cursor:pointer;margin-top:12px}.poster{aspect-ratio:4/5;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(135deg,#fff 0 46%,#e0e7e0 47%);border:1px solid #d9e0d9}.copy{position:absolute;left:7%;top:8%;width:55%;z-index:2}.copy .logo{font-weight:1000;margin-bottom:38px}.copy .logo b{color:var(--g)}.copy h1{font-size:36px;line-height:.92;margin:0;text-transform:uppercase}.copy h1 em{display:block;color:var(--g);font-style:normal}.copy p{font-size:13px;line-height:1.35}.cta{position:absolute;left:7%;right:7%;bottom:7%;background:#111;color:#fff;border-radius:10px;padding:13px;font-weight:900}.cta b{color:#7ee24a}.out{margin-top:14px;border:1px solid #e3e8e3;border-radius:12px;padding:12px;background:#fbfcfb}.out strong{display:block;font-size:11px;text-transform:uppercase;margin-bottom:6px}.out pre{white-space:pre-wrap;margin:0;font:13px/1.45 Arial}.cols{display:grid;grid-template-columns:360px 1fr;gap:16px}@media(max-width:900px){.grid,.cols{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap"><div class="head"><div class="brand">F1 <b>CONTENT STUDIO</b></div><div class="badge">TEST LIVE • SUSA</div></div><div class="grid"><div class="card"><h2>Input</h2><label>Frase</label><textarea id="input">cerchiamo alloggi signorili a susa per clientela referenziata</textarea><button class="btn" onclick="run()">GENERA PACCHETTO</button><p style="font-size:12px;color:#667">Il test usa esclusivamente la frase inserita per costruire contenuti e prompt visuali.</p></div><div class="card"><div class="cols"><div class="poster"><div class="copy"><div class="logo">F1 <b>IMMOBILIARE</b></div><h1 id="title">CERCHIAMO <em>ALLOGGI SIGNORILI</em></h1><p id="body">A Susa, per clientela referenziata.</p></div><div class="cta">HAI UN IMMOBILE ADATTO? • <b>371.370.8294</b></div></div><div id="outputs"></div></div></div></div></div>
<script>
const $=x=>document.getElementById(x); const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function parse(q){q=(q||'').trim();let city='Susa';let m=q.match(/\ba\s+([a-zà-ù' ]+?)(?:\s+per\b|$)/i);if(m)city=m[1].trim().replace(/\b\w/g,c=>c.toUpperCase());let segment=/signoril/i.test(q)?'alloggi signorili':'immobili';let proof=/referenziat/i.test(q)?'clientela referenziata':'clienti selezionati';return {q,city,segment,proof};}
function run(){let d=parse($('input').value);let hook=`CERCHIAMO ${d.segment.toUpperCase()} A ${d.city.toUpperCase()}`;let detail=`F1 Immobiliare ricerca ${d.segment} a ${d.city} per ${d.proof}. Valutiamo immobili ben presentati, in contesti residenziali di qualità e coerenti con le esigenze di clienti già profilati.`;let cta='Hai un immobile con queste caratteristiche? Contattaci su WhatsApp al 371 370 8294.';$('title').innerHTML=`CERCHIAMO <em>${d.segment.toUpperCase()}</em>`;$('body').textContent=`A ${d.city}, per ${d.proof}.`;
let carousel=`SLIDE 1 — ${hook}\nSLIDE 2 — Abbiamo ${d.proof} interessata alla zona di ${d.city}.\nSLIDE 3 — Cerchiamo ${d.segment}, ben tenuti o ristrutturati, in contesti di qualità.\nSLIDE 4 — Se stai valutando la vendita, possiamo verificare subito se il tuo immobile è in linea con le richieste attive.\nSLIDE 5 — F1 Immobiliare conosce il territorio e lavora con richieste reali e profilate.\nSLIDE 6 — ${cta}`;
let reel=`0–3s: “Cerchiamo ${d.segment} a ${d.city}.”\n3–8s: “Abbiamo ${d.proof} che sta cercando casa proprio qui.”\n8–16s: mostra interni eleganti, dettagli di pregio e scorci di ${d.city}.\n16–23s: “Se possiedi un immobile adatto, possiamo verificare subito l'interesse.”\n23–30s: “Scrivici su WhatsApp: 371 370 8294.”`;
let ugc=`“Se hai un appartamento signorile a ${d.city}, questo messaggio è per te. In questo momento F1 Immobiliare sta cercando ${d.segment} per ${d.proof}. Cerchiamo immobili ben tenuti, ristrutturati o inseriti in contesti residenziali di qualità. Se stai pensando di vendere, scrivici su WhatsApp al 371 370 8294 e verifichiamo insieme se il tuo immobile corrisponde a una richiesta attiva.”`;
let caption=`${hook}\n\n${detail}\n\nNon stiamo cercando un immobile generico: vogliamo individuare soluzioni coerenti con richieste già definite.\n\n${cta}\n\n#F1Immobiliare #Susa #ValleDiSusa #CerchiamoCasa #Immobiliare`;
let prompt=`Fotografia immobiliare editoriale premium, interno di appartamento signorile italiano a ${d.city}, soggiorno luminoso, materiali di qualità, parquet, arredi contemporanei eleganti ma sobri, grandi finestre, atmosfera autentica e abitabile, fotografia professionale realistica, luce naturale, composizione verticale 4:5, spazio negativo a sinistra per testo pubblicitario, nessuna persona, nessun testo, nessun logo.`;
let post=`TITOLO: ${hook}\nSOTTOTITOLO: Per ${d.proof}\nTESTO: ${detail}\nCTA: ${cta}\nFORMATO: 1080×1350`;
let items=[['POST',post],['CAROSELLO',carousel],['REEL 30s',reel],['UGC IA',ugc],['CAPTION',caption],['PROMPT IMMAGINE',prompt]];$('outputs').innerHTML=items.map(x=>`<div class="out"><strong>${x[0]}</strong><pre>${esc(x[1])}</pre></div>`).join('');}
run();
</script></body></html>
